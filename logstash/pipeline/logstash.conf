input {
  # Django / Celery logs via TCP socket (Python SocketHandler)
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Parse timestamp if present
  date {
    match => ["asctime", "yyyy-MM-dd HH:mm:ss,SSS"]
    target => "@timestamp"
    remove_field => ["asctime"]
  }

  # Tag Celery task logs separately
  if [name] =~ /celery/ or [name] =~ /Docchat\.tasks/ {
    mutate { add_tag => ["celery"] }
  }

  # Tag WebSocket / consumer logs
  if [name] =~ /consumers/ {
    mutate { add_tag => ["websocket"] }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "docuquery-logs-%{+YYYY.MM.dd}"
  }
}
