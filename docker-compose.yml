services:

  # ---------------------------------------------------------------------------
  # Core services — always start (no profile)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16
    container_name: docuquery_db
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    
    volumes:
     - redis_data:/data


  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    restart: unless-stopped

    volumes:
      - chroma_data:/chroma/chroma

    ports:
      - "8001:8000"

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8000 && printf \"GET /api/v2/heartbeat HTTP/1.0\\r\\n\\r\\n\" >&3 && timeout 3 cat <&3 | grep -q nanosecond'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  web:
    build: .
    container_name: docuquery_app
    restart: unless-stopped

    working_dir: /app/DocuQuery

    env_file:
      - .env

    command: >
      sh -c "
      python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      daphne -b 0.0.0.0 -p 8000 DocuQuery.asgi:application
      "

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    environment:
      DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      ELK_ENABLED: ${ELK_ENABLED:-false}
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy


  # ---------------------------------------------------------------------------
  # Celery profile — start with: docker compose --profile celery up
  # ---------------------------------------------------------------------------
  celery_worker:
    build: .
    container_name: celery_worker
    restart: unless-stopped
    profiles: [celery]

    working_dir: /app/DocuQuery

    env_file:
      - .env

    command: celery -A DocuQuery worker --loglevel=info -E --concurrency=1

    volumes:
      - .:/app

    environment:
      DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      ELK_ENABLED: ${ELK_ENABLED:-false}
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy


  celery_beat:
    build: .
    container_name: celery_beat
    restart: unless-stopped
    profiles: [celery]

    working_dir: /app/DocuQuery

    env_file:
      - .env

    command: celery -A DocuQuery beat --loglevel=info

    volumes:
      - .:/app

    environment:
      DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      ELK_ENABLED: ${ELK_ENABLED:-false}
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy


  flower:
    build: .
    container_name: flower
    restart: unless-stopped
    profiles: [celery]

    working_dir: /app/DocuQuery

    env_file:
      - .env

    command: celery -A DocuQuery flower --port=5555 --broker=redis://redis:6379/0 --broker_api=redis://redis:6379/0

    ports:
      - "5555:5555"

    environment:
      DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started


  # ---------------------------------------------------------------------------
  # ELK profile — start with: docker compose --profile elk up
  # ---------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch
    restart: unless-stopped
    profiles: [elk]

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms384m -Xmx384m

    volumes:
      - es_data:/usr/share/elasticsearch/data

    ports:
      - "9200:9200"

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s


  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.0
    container_name: logstash
    restart: unless-stopped
    profiles: [elk]

    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro

    ports:
      - "5000:5000"

    environment:
      - LS_JAVA_OPTS=-Xms300m -Xmx300m

    depends_on:
      elasticsearch:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9600 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s


  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: kibana
    restart: unless-stopped
    profiles: [elk]

    ports:
      - "5601:5601"

    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200

    depends_on:
      elasticsearch:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s


volumes:
  postgres_data:
  chroma_data:
  es_data:
  redis_data:
