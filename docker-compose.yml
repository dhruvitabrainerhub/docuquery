services:

  db:
    image: postgres:16
    container_name: docuquery_db
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5


  web:
    build: .
    container_name: docuquery_app

    working_dir: /app/DocuQuery

    env_file:
      - .env

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000 --noreload
      "

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    environment:
      DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy


  celery_worker:
    build: .

    container_name: celery_worker

    working_dir: /app/DocuQuery

    env_file:
      - .env

    command: celery -A DocuQuery worker --loglevel=info -E --concurrency=2

    volumes:
      - .:/app

    environment:
      DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped


  celery_beat:
    build: .

    container_name: celery_beat

    working_dir: /app/DocuQuery

    env_file:
      - .env

    command: celery -A DocuQuery beat --loglevel=info

    volumes:
      - .:/app

    environment:
      DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped


  flower:
    build: .
  
    container_name: flower

    working_dir: /app/DocuQuery

    env_file:
      - .env

    command: celery -A DocuQuery flower --port=5555 --broker=redis://redis:6379/0 --broker_api=redis://redis:6379/0

    ports:
      - "5555:5555"
    
    environment:
      DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started

    restart: unless-stopped

volumes:
  postgres_data: